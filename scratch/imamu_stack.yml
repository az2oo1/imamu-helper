version: '3.8'

services:
  # Main Application Service
  app:
    image: ghcr.io/az2oo1/imamu-helper:latest
    ports:
      - "3013:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SQL_HOST=${SQL_HOST:-192.168.100.4}
      - SQL_BACKUP_HOST=${SQL_BACKUP_HOST}
      - SQL_PORT=${SQL_PORT:-26257}
      - SQL_USER=${SQL_USER:-root}
      - SQL_PASSWORD=${SQL_PASSWORD:-}
      - SQL_DB_NAME=${SQL_DB_NAME:-defaultdb}
      - SQL_SSL=${SQL_SSL:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://root@192.168.100.4:26257/defaultdb?sslmode=disable}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://192.168.100.4:3900}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-garageadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-garagepassword}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-imamu-uploads}
      - S3_REGION=${S3_REGION:-garage}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://192.168.100.4:3900/imamu-uploads}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://192.168.100.4:3000}
    depends_on:
      - cockroachdb
      - garage
    restart: unless-stopped

  # CockroachDB Database Service (Distributed SQL, PG-compatible)
  cockroachdb:
    image: cockroachdb/cockroach:v23.2.3
    container_name: imamu_cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8082:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-Compatible Object Storage Service (MinIO S3 engine replacing broken Garage configuration)
  garage:
    image: minio/minio:latest
    container_name: imamu_garage
    command: server /data --console-address ":3902"
    environment:
      - MINIO_ROOT_USER=garageadmin
      - MINIO_ROOT_PASSWORD=garagepassword
    ports:
      - "3900:9000"
      - "3902:3902"
    volumes:
      - /AppData/IMAMU/garage/data:/data
    restart: unless-stopped

volumes:
  cockroach_data:
    driver: local
  garage_data:
    driver: local
  garage_blobs:
    driver: local

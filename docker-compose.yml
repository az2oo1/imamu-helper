version: '3.8'

services:
  # Main Application Service
  app:
    image: ${APP_IMAGE:-ghcr.io/az2oo1/imamu-helper:latest}
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # PostgreSQL Database configuration
      - SQL_HOST=${SQL_HOST:-postgres}
      - SQL_BACKUP_HOST=${SQL_BACKUP_HOST}
      - SQL_PORT=${SQL_PORT:-5432}
      - SQL_USER=${SQL_USER:-imamu}
      - SQL_PASSWORD=${SQL_PASSWORD:-imamu_dev_password}
      - SQL_DB_NAME=${SQL_DB_NAME:-imamu}
      - SQL_SSL=${SQL_SSL:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://imamu:imamu_dev_password@postgres:5432/imamu?sslmode=disable}
      # Garage S3 Object Storage configuration
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-GKbb93a64d9b59553812b16ab7}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-7019369bc02559db1603063931261ccb4fab61b2cc4ac32c239a35295cb57705}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-imamu-uploads}
      - S3_BUCKET_PLANS=${S3_BUCKET_PLANS:-imamu-plans}
      - S3_BUCKET_PFPS=${S3_BUCKET_PFPS:-imamu-pfps}
      - S3_BUCKET_DALILAH=${S3_BUCKET_DALILAH:-imamu-dalilah}
      - S3_BUCKET_RESOURCES=${S3_BUCKET_RESOURCES:-imamu-resources}
      - S3_BUCKET_NEWS=${S3_BUCKET_NEWS:-imamu-news}
      - S3_REGION=${S3_REGION:-garage}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-/uploads}
      - APP_URL=${APP_URL:-http://100.70.48.23:3000}
      # Umami Analytics tracking
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_URL=${UMAMI_URL:-}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${UMAMI_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Database Service (primary datastore)
  postgres:
    image: postgres:17-alpine
    container_name: imamu_postgres
    environment:
      POSTGRES_USER: ${SQL_USER:-imamu}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-imamu_dev_password}
      POSTGRES_DB: ${SQL_DB_NAME:-imamu}
      IMAMU_BACKUP_PASSWORD: ${IMAMU_BACKUP_PASSWORD:-backup_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432" # SQL Client Port
    volumes:
      - /AppData/IMAMU/_DB:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-imamu} -d ${SQL_DB_NAME:-imamu}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Databasus - PostgreSQL backup app (scheduled backups, PITR, restore verification)
  databasus:
    image: databasus/databasus:${DATABASUS_TAG:-latest}
    container_name: imamu_databasus
    ports:
      - "${DATABASUS_HOST_PORT:-4005}:4005" # Web UI
    volumes:
      - /AppData/IMAMU/Backupapp:/databasus-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Open-Studio - PostgreSQL viewer/editor (opt-in, no published image: built from source)
  # Start with: docker compose --profile dbview up -d open-studio
  open-studio:
    build:
      context: ${OPEN_STUDIO_REPO:-https://github.com/andersmyrmel/open-studio.git}
    image: imamu/open-studio:latest
    container_name: imamu_open_studio
    profiles: ["dbview"]
    ports:
      - "${OPEN_STUDIO_HOST_PORT:-8080}:3000" # Web UI
    environment:
      DATABASE_URL: postgresql://${SQL_USER:-imamu}:${SQL_PASSWORD:-imamu_dev_password}@postgres:5432/${SQL_DB_NAME:-imamu}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Garage Config Initializer
  garage_init:
    image: alpine:latest
    container_name: imamu_garage_init
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/garage
        cat << 'EOF' > /etc/garage/garage.toml
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "sqlite"

        replication_factor = 1
        consistency_mode = "consistent"

        rpc_bind_addr = "0.0.0.0:3901"
        rpc_secret = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "0.0.0.0:3900"
        root_domain = ".s3.garage"

        [s3_web]
        bind_addr = "0.0.0.0:3902"
        root_domain = ".web.garage"

        [admin]
        api_bind_addr = "0.0.0.0:3903"
        admin_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        metrics_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        EOF
        echo "garage.toml generated successfully!"
    volumes:
      - /AppData/IMAMU/objectstorage/config:/etc/garage

  # Garage S3-Compatible Object Storage Service
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: imamu_garage
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    environment:
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
      - GARAGE_ADMIN_API_BIND_ADDR=0.0.0.0:3903
      - GARAGE_ADMIN_ADMIN_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - GARAGE_ADMIN_METRICS_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
    ports:
      - "3900:3900" # S3 API Port
      - "3901:3901" # RPC Port
      - "3902:3902" # S3 Web Port
      - "3903:3903" # Admin API Port
    volumes:
      - /AppData/IMAMU/objectstorage/config:/etc/garage
      - /AppData/IMAMU/objectstorage/meta:/var/lib/garage/meta
      - /AppData/IMAMU/objectstorage/data:/var/lib/garage/data
    depends_on:
      garage_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Garage Web UI (Noooste/garage-ui)
  garage-ui:
    image: noooste/garage-ui:latest
    container_name: imamu_garage_ui
    ports:
      - "3904:8080" # Web UI Port
    environment:
      - GARAGE_UI_GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_UI_GARAGE_ADMIN_ENDPOINT=http://garage:3903
      - GARAGE_UI_GARAGE_ADMIN_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
    depends_on:
      - garage
    restart: unless-stopped

  # ── Umami Web Analytics ───────────────────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: imamu_umami
    ports:
      - "${UMAMI_HOST_PORT:-3006}:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:-umami}@umami-db:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-change_me_to_a_long_random_secret}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated PostgreSQL instance for Umami
  umami-db:
    image: postgres:15-alpine
    container_name: imamu_umami_db
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:-umami}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_POSTGRES_USER:-umami} -d ${UMAMI_POSTGRES_DB:-umami}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  umami_db_data:
    driver: local

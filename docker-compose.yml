version: '3.8'

services:
  # Main Application Service
  app:
    image: ${APP_IMAGE:-ghcr.io/az2oo1/imamu-helper:latest}
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # CockroachDB Database configuration
      - SQL_HOST=${SQL_HOST:-cockroachdb}
      - SQL_BACKUP_HOST=${SQL_BACKUP_HOST}
      - SQL_PORT=${SQL_PORT:-26257}
      - SQL_USER=${SQL_USER:-root}
      - SQL_PASSWORD=${SQL_PASSWORD:-}
      - SQL_DB_NAME=${SQL_DB_NAME:-defaultdb}
      - SQL_SSL=${SQL_SSL:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable}
      # Garage S3 Object Storage configuration
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-GKbb93a64d9b59553812b16ab7}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-7019369bc02559db1603063931261ccb4fab61b2cc4ac32c239a35295cb57705}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-imamu-uploads}
      - S3_BUCKET_PLANS=${S3_BUCKET_PLANS:-imamu-plans}
      - S3_BUCKET_PFPS=${S3_BUCKET_PFPS:-imamu-pfps}
      - S3_BUCKET_DALILAH=${S3_BUCKET_DALILAH:-imamu-dalilah}
      - S3_BUCKET_RESOURCES=${S3_BUCKET_RESOURCES:-imamu-resources}
      - S3_BUCKET_NEWS=${S3_BUCKET_NEWS:-imamu-news}
      - S3_REGION=${S3_REGION:-garage}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-/uploads}
      # Optional features
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://100.70.48.23:3000}
    depends_on:
      - cockroachdb
      - garage
    restart: unless-stopped

  # CockroachDB Database Service (Distributed SQL, PG-compatible)
  cockroachdb:
    image: cockroachdb/cockroach:v23.2.3
    container_name: imamu_cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257" # SQL Client Port
      - "8082:8080"   # CockroachDB Admin Web Console UI
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Garage Config Initializer
  garage_init:
    image: alpine:latest
    container_name: imamu_garage_init
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/garage
        cat << 'EOF' > /etc/garage/garage.toml
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "sqlite"

        replication_factor = 1
        consistency_mode = "consistent"

        rpc_bind_addr = "0.0.0.0:3901"
        rpc_secret = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "0.0.0.0:3900"
        root_domain = ".s3.garage"

        [s3_web]
        bind_addr = "0.0.0.0:3902"
        root_domain = ".web.garage"

        [admin]
        api_bind_addr = "0.0.0.0:3903"
        admin_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        metrics_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        EOF
        echo "garage.toml generated successfully!"
    volumes:
      - garage_config:/etc/garage

  # Garage S3-Compatible Object Storage Service
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: imamu_garage
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    environment:
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
      - GARAGE_ADMIN_API_BIND_ADDR=0.0.0.0:3903
      - GARAGE_ADMIN_ADMIN_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - GARAGE_ADMIN_METRICS_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
    ports:
      - "3900:3900" # S3 API Port
      - "3901:3901" # RPC Port
      - "3902:3902" # S3 Web Port
      - "3903:3903" # Admin API Port
    volumes:
      - garage_config:/etc/garage
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    depends_on:
      garage_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Garage Web UI (Noooste/garage-ui)
  garage-ui:
    image: noooste/garage-ui:latest
    container_name: imamu_garage_ui
    ports:
      - "3904:8080" # Web UI Port
    environment:
      - GARAGE_UI_GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_UI_GARAGE_ADMIN_ENDPOINT=http://garage:3903
      - GARAGE_UI_GARAGE_ADMIN_TOKEN=60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890
    depends_on:
      - garage
    restart: unless-stopped

volumes:
  cockroach_data:
    driver: local
  garage_config:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local

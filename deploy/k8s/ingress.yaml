apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imamu-helper
  namespace: imamu
  labels:
    app.kubernetes.io/name: imamu-helper
    app.kubernetes.io/part-of: imamu-helper
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: imamu-helper.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imamu-helper
                port:
                  number: 80
  # Uncomment and adjust for TLS termination
  # tls:
  #   - hosts:
  #       - imamu-helper.example.com
  #     secretName: imamu-helper-tls

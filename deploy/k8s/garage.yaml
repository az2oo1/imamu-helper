apiVersion: v1
kind: Service
metadata:
  name: imamu-garage
  namespace: imamu
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: imamu-helper
spec:
  type: ClusterIP
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: s3-web
      port: 3902
      targetPort: 3902
    - name: admin-api
      port: 3903
      targetPort: 3903
  selector:
    app.kubernetes.io/name: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: imamu
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: imamu-helper
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1
    consistency_mode = "consistent"

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_secret = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.garage"

    [s3_web]
    bind_addr = "0.0.0.0:3902"
    root_domain = ".web.garage"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    admin_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
    metrics_token = "60fa6e1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: imamu
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: imamu-helper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imamu-garage
  namespace: imamu
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: imamu-helper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: imamu-helper
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.1.0
          command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          env:
            - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
              value: "true"
          ports:
            - name: s3-api
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: s3-web
              containerPort: 3902
            - name: admin-api
              containerPort: 3903
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/garage
            - name: storage
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: storage
          persistentVolumeClaim:
            claimName: garage-data
